[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisp-materials"
version = "3.0.0"
description = "Compile target-relevant chemical rules into executable crystal descriptors."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Jaehwan Choi", email = "jaehwan.micc@gmail.com"},
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "openai>=1.68",
  "python-dotenv>=1.0",
]

[project.scripts]
crisp = "crisp.cli:main"

[tool.setuptools]
packages = ["crisp"]
